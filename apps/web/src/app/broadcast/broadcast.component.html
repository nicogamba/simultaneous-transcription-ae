<div class="broadcast">
  <h1>Panel de Broadcast</h1>

  <section class="config">
    <label>
      Session ID
      <input type="text" [ngModel]="sessionId()" (ngModelChange)="sessionId.set($event)" />
    </label>
    <label>
      Idioma fuente
      <select [ngModel]="sourceLanguage()" (ngModelChange)="sourceLanguage.set($event)">
        <option [ngValue]="'en'">Inglés (EN)</option>
        <option [ngValue]="'es'">Español (ES)</option>
      </select>
    </label>
    <label>
      Idioma destino
      <select [ngModel]="targetLanguage()" (ngModelChange)="targetLanguage.set($event)">
        <option [ngValue]="'es'">Español (ES)</option>
        <option [ngValue]="'en'">Inglés (EN)</option>
      </select>
    </label>
    <button class="primary" (click)="connect()" [disabled]="connected">
      {{ connected ? 'Conectado' : 'Conectar' }}
    </button>
  </section>

  <section class="source">
    <h2>Fuente de audio</h2>
    <div class="mic">
      <button (click)="startMic()" [disabled]="status() === 'recording' || !connected">
        Iniciar micrófono
      </button>
      <button (click)="stopMic()" [disabled]="status() !== 'recording'">
        Detener micrófono
      </button>
    </div>
    <div class="file">
      <input id="file-input" type="file" accept=".mp3,.wav" (change)="onFileSelected($event)" />
      <button (click)="sendFile()" [disabled]="!connected || !fileName()">
        Enviar archivo
      </button>
    </div>
  </section>

  <section class="actions">
    <button class="danger" (click)="endSession()" [disabled]="!connected">
      Finalizar sesión
    </button>
  </section>

  <p class="message" [class.error]="message().includes('Error')">{{ message() }}</p>
  <p class="state">
    Estado: <strong>{{ status() }}</strong>
  </p>
</div>
