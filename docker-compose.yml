services:
  postgres:
    image: postgres:16-alpine
    container_name: transcribe-postgres
    environment:
      POSTGRES_USER: transcribe
      POSTGRES_PASSWORD: transcribe
      POSTGRES_DB: transcribe
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transcribe']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: transcribe-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: transcribe-api
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: mock
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: transcribe-web
    ports:
      - '8080:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: